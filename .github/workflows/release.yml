name: Release

# Push a tag vX.Y.Z (or vX.Y.Z-beta.1 for a pre-release) to build and publish.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      # Deploy key with write access to thomas-schreck/homebrew-tap; without
      # it the tap update is skipped.
      TAP_DEPLOY_KEY: ${{ secrets.TAP_DEPLOY_KEY }}
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: |
          sw_vers
          swift --version

      - name: Dependencies (YARA-X, libmagic)
        run: brew install yara-x libmagic

      - name: Test
        run: |
          swift build
          swift test

      - name: Build artifacts
        run: make dist VERSION="${GITHUB_REF_NAME#v}" BUILD="${{ github.run_number }}"

      - name: Release notes
        run: |
          v="${GITHUB_REF_NAME#v}"
          min=$(/usr/libexec/PlistBuddy -c 'Print LSMinimumSystemVersion' dist/hexwerk.app/Contents/Info.plist)
          cat > notes.md <<NOTES
          ## Downloads
          - **hexwerk-$v.dmg** / **hexwerk-$v.zip**: the app (Apple silicon, macOS $min or later)
          - **hexwerk-cli-$v-arm64.tar.gz**: the \`hexwerk\` command line tool; keep \`magic.mgc\` next to the binary
          - **SHA256SUMS**: checksums (\`shasum -a 256 -c SHA256SUMS\`)

          ## First start
          hexwerk is ad-hoc signed, not notarized. macOS blocks the first start of a downloaded copy:
          open it once, then allow it under *System Settings → Privacy & Security → Open Anyway*.
          Alternatively: \`xattr -dr com.apple.quarantine /Applications/hexwerk.app\`.

          Third-party licenses are in \`THIRD_PARTY_NOTICES.md\` (in the app under Contents/Resources and in the CLI archive).
          NOTES

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pre=""
          [[ "$GITHUB_REF_NAME" == *-* ]] && pre="--prerelease"
          v="${GITHUB_REF_NAME#v}"
          gh release create "$GITHUB_REF_NAME" $pre --verify-tag \
            --title "hexwerk $v" --notes-file notes.md --generate-notes \
            "dist/hexwerk-$v.dmg" "dist/hexwerk-$v.zip" "dist/hexwerk-cli-$v-arm64.tar.gz" dist/SHA256SUMS

      - name: Update Homebrew tap
        if: env.TAP_DEPLOY_KEY != ''
        run: |
          v="${GITHUB_REF_NAME#v}"
          key="$RUNNER_TEMP/tap_key"
          printf '%s\n' "$TAP_DEPLOY_KEY" > "$key"
          chmod 600 "$key"
          export GIT_SSH_COMMAND="ssh -i $key -o IdentitiesOnly=yes"
          git clone --depth 1 git@github.com:thomas-schreck/homebrew-tap.git "$RUNNER_TEMP/tap"
          cd "$RUNNER_TEMP/tap"
          ./update.sh "$v" \
            "$(shasum -a 256 "$GITHUB_WORKSPACE/dist/hexwerk-$v.zip" | cut -d' ' -f1)" \
            "$(shasum -a 256 "$GITHUB_WORKSPACE/dist/hexwerk-cli-$v-arm64.tar.gz" | cut -d' ' -f1)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "hexwerk $v"
          git push
          rm -f "$key"
