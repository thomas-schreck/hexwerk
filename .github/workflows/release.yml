name: Release

# Push a tag vX.Y.Z (or vX.Y.Z-beta.1 for a pre-release) to build and publish.
on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  # Known vulnerabilities in the Rust crates statically linked via YARA-X.
  audit:
    uses: ./.github/workflows/audit.yml

  release:
    needs: audit
    runs-on: macos-26
    permissions:
      contents: write        # create the release
      id-token: write        # build provenance
      attestations: write
    timeout-minutes: 60
    env:
      # Deploy key with write access to thomas-schreck/homebrew-tap; without
      # it the tap update is skipped.
      TAP_DEPLOY_KEY: ${{ secrets.TAP_DEPLOY_KEY }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Toolchain
        run: |
          sw_vers
          swift --version

      - name: Dependencies (YARA-X from source, libmagic)
        uses: ./.github/actions/deps

      - name: Test
        run: |
          swift build
          swift test

      - name: Build artifacts
        run: make dist VERSION="${GITHUB_REF_NAME#v}" BUILD="${{ github.run_number }}"

      # SPDX SBOM; clones YARA-X at the notices version itself (the deps
      # action keeps only the built library). Creation time = tag commit.
      - name: SBOM
        id: sbom
        run: |
          v="${GITHUB_REF_NAME#v}"
          SOURCE_DATE_EPOCH=$(git log -1 --format=%ct) make sbom VERSION="$v"
          echo "path=dist/hexwerk-$v.spdx.json" >> "$GITHUB_OUTPUT"
          cd dist && shasum -a 256 "hexwerk-$v.spdx.json" >> SHA256SUMS && cat SHA256SUMS

      - name: Build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/hexwerk-*.dmg
            dist/hexwerk-*.zip
            dist/hexwerk-cli-*.tar.gz
            dist/hexwerk-*.spdx.json

      - name: SBOM attestation
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-path: |
            dist/hexwerk-*.dmg
            dist/hexwerk-*.zip
            dist/hexwerk-cli-*.tar.gz
          sbom-path: ${{ steps.sbom.outputs.path }}

      - name: Release notes
        run: |
          v="${GITHUB_REF_NAME#v}"
          min=$(/usr/libexec/PlistBuddy -c 'Print LSMinimumSystemVersion' dist/hexwerk.app/Contents/Info.plist)
          cat > notes.md <<NOTES
          ## Downloads
          - **hexwerk-$v.dmg** / **hexwerk-$v.zip**: the app (Apple silicon, macOS $min or later)
          - **hexwerk-cli-$v-arm64.tar.gz**: the \`hexwerk\` command line tool; keep \`magic.mgc\` next to the binary
          - **hexwerk-$v.spdx.json**: SBOM (SPDX 2.3) of the app and the CLI, attested for each download: \`gh attestation verify hexwerk-$v.dmg -R thomas-schreck/hexwerk --predicate-type https://spdx.dev/Document/v2.3\`
          - **SHA256SUMS**: checksums (\`shasum -a 256 -c SHA256SUMS\`)

          Verify that a download was built by this repository's release workflow:
          \`gh attestation verify hexwerk-$v.dmg -R thomas-schreck/hexwerk\`

          ## First start
          hexwerk is ad-hoc signed, not notarized. macOS blocks the first start of a downloaded copy:
          open it once, then allow it under *System Settings → Privacy & Security → Open Anyway*.
          Alternatively: \`xattr -dr com.apple.quarantine /Applications/hexwerk.app\`.

          Third-party licenses are in \`THIRD_PARTY_NOTICES.md\` (in the app under Contents/Resources and in the CLI archive).
          NOTES

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pre=""
          [[ "$GITHUB_REF_NAME" == *-* ]] && pre="--prerelease"
          v="${GITHUB_REF_NAME#v}"
          gh release create "$GITHUB_REF_NAME" $pre --verify-tag \
            --title "hexwerk $v" --notes-file notes.md --generate-notes \
            "dist/hexwerk-$v.dmg" "dist/hexwerk-$v.zip" "dist/hexwerk-cli-$v-arm64.tar.gz" \
            "dist/hexwerk-$v.spdx.json" dist/SHA256SUMS

      - name: Update Homebrew tap
        if: env.TAP_DEPLOY_KEY != ''
        run: |
          v="${GITHUB_REF_NAME#v}"
          key="$RUNNER_TEMP/tap_key"
          printf '%s\n' "$TAP_DEPLOY_KEY" > "$key"
          chmod 600 "$key"
          export GIT_SSH_COMMAND="ssh -i $key -o IdentitiesOnly=yes"
          git clone --depth 1 git@github.com:thomas-schreck/homebrew-tap.git "$RUNNER_TEMP/tap"
          cd "$RUNNER_TEMP/tap"
          ./update.sh "$v" \
            "$(shasum -a 256 "$GITHUB_WORKSPACE/dist/hexwerk-$v.zip" | cut -d' ' -f1)" \
            "$(shasum -a 256 "$GITHUB_WORKSPACE/dist/hexwerk-cli-$v-arm64.tar.gz" | cut -d' ' -f1)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "hexwerk $v"
          git push
          rm -f "$key"
