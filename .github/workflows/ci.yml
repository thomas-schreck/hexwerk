name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Toolchain
        run: |
          sw_vers
          xcode-select -p
          swift --version

      - name: Dependencies (YARA-X from source, libmagic)
        uses: ./.github/actions/deps

      - name: Build
        run: swift build

      - name: Test
        run: swift test

      # Version of local builds from git tags (scripts/version.sh, #133).
      - name: Version script
        run: scripts/version-test.sh

      # Only a binary signed with allow-jit JIT-compiles scripts, and only
      # there did endless loops ignore the time limit (#131). Ad-hoc signed
      # like a release; the variable makes the test fail instead of skip.
      - name: Signed CLI script time limit
        run: |
          make sign-cli
          HEXWERK_REQUIRE_SIGNED_CLI=1 swift test --skip-build --filter SignedScriptTimeoutTests

      # The release SBOM generator, checked on every change; the SBOM itself
      # is validated structurally before it is written.
      - name: SBOM
        run: make sbom VERSION=0.0.0-ci
