name: Bug report
description: Something does not work as expected.
labels: ["type: bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you do, what did you expect, what happened instead?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: Minimal steps. Attach small input files, schemas or scripts if possible. Never attach live malware.
      placeholder: |
        1. Open …
        2. …
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: hexwerk version or commit
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS version and Mac (Apple silicon / Intel)
  - type: dropdown
    id: part
    attributes:
      label: Part
      options: [App, CLI, Kaitai Struct / .ksy, YARA, Scripting, Other]
  - type: textarea
    id: logs
    attributes:
      label: Crash log or output
      render: text
